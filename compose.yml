services:
  backend:
    build:
      context: ./conduit-backend
      dockerfile: Dockerfile
    image: conduit-backend:1.2.0
    expose:
      - "8000"
    env_file:
      - ./conduit-backend/.env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-conduit}
      POSTGRES_USER: ${POSTGRES_USER:-conduit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_HOST: database
      POSTGRES_PORT: "5432"
    depends_on:
      database:
        condition: service_healthy

    volumes:
      - static_data:/app/staticfiles
    restart: unless-stopped

  frontend:
    build:
      context: ./conduit-frontend
      dockerfile: Dockerfile
    image: conduit-frontend:1.0.0
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    volumes:
      - static_data:/usr/share/nginx/django-static:ro
    depends_on:
      - backend
    restart: unless-stopped

  database:
    image: postgres:14
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-conduit}
      POSTGRES_USER: ${POSTGRES_USER:-conduit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  static_data: